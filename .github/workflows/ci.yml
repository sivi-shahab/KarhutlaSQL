name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - run: make test
      - run: make build
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && make vuln
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: make docs
      # Web UI ter-embed (internal/webui/dist) harus sesuai sumber web/.
      - run: make webui && git diff --exit-code internal/webui/dist

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r tests/python/requirements.txt
      # testdata mengunduh ekstensi DuckDB tpch.
      - run: make test-integration PYTHON=python
