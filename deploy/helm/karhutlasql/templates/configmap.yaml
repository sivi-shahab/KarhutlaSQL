{{- if or .Values.policy .Values.classification .Values.reports }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "karhutlasql.fullname" . }}-policy
  labels: {{- include "karhutlasql.labels" . | nindent 4 }}
data:
  {{- with .Values.policy }}
  policy.yaml: |
    {{- . | nindent 4 }}
  {{- end }}
  {{- with .Values.classification }}
  classification.yaml: |
    {{- . | nindent 4 }}
  {{- end }}
  {{- with .Values.reports }}
  reports.yaml: |
    {{- . | nindent 4 }}
  {{- end }}
{{- end }}
