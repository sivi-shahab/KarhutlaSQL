{{- $secret := required "auth.existingSecret is required" .Values.auth.existingSecret -}}
{{- if and .Values.oidc.issuer (not .Values.policy) }}{{ fail "oidc.issuer requires policy (allowlist & roles)" }}{{ end -}}
{{- $lake := .Values.ducklake -}}
{{- $config := or .Values.policy .Values.classification .Values.reports $lake.catalog .Values.verifiedQueries -}}
{{- $allowed := .Values.allowedDirectories -}}
{{- if $lake.catalog }}{{ $allowed = append $allowed $lake.dataPath }}{{ end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "karhutlasql.fullname" . }}
  labels: {{- include "karhutlasql.labels" . | nindent 4 }}
spec:
  replicas: 1 # DuckDB single-writer
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "karhutlasql.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "karhutlasql.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/scheme: https # port admin ikut TLS server
        checksum/policy: {{ printf "%s%s%s%s%s" .Values.policy .Values.classification .Values.reports (toJson $lake) .Values.verifiedQueries | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- if or .Values.tls.existingSecret .Values.reportSigning.existingSecret }}
      initContainers:
        {{- if .Values.tls.existingSecret }}
        - name: tls-perms
          image: {{ .Values.tls.initImage }}
          command: ["sh", "-c", "cp /tls-secret/tls.crt /tls-secret/tls.key /tls/ && chmod 600 /tls/tls.key"]
          securityContext: {{- include "karhutlasql.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: tls-secret, mountPath: /tls-secret, readOnly: true }
            - { name: tls, mountPath: /tls }
        {{- end }}
        {{- if .Values.reportSigning.existingSecret }}
        - name: report-key-perms
          image: {{ .Values.tls.initImage }}
          command: ["sh", "-c", "cp /report-secret/report.key /keys/ && chmod 600 /keys/report.key"]
          securityContext: {{- include "karhutlasql.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: report-secret, mountPath: /report-secret, readOnly: true }
            - { name: keys, mountPath: /keys }
        {{- end }}
      {{- end }}
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --database-filename=/data/warehouse.duckdb
            - --host=0.0.0.0
            - --port=31337
            - --metrics-port=9090
            - --username={{ .Values.auth.username }}
            - --query-timeout={{ .Values.queryTimeout }}
            - --max-concurrent={{ .Values.scheduler.maxConcurrent }}
            - --queue-size={{ .Values.scheduler.queueSize }}
            - --queue-timeout={{ .Values.scheduler.queueTimeout }}
            - --rate-limit={{ .Values.rateLimit.perUser }}
            - --rate-burst={{ .Values.rateLimit.burst }}
            - --slow-query-threshold={{ .Values.slowQueryThreshold }}
            - --query-profiling={{ .Values.queryProfiling }}
            {{- if .Values.tls.existingSecret }}
            - --tls-cert=/tls/tls.crt
            - --tls-key=/tls/tls.key
            {{- else }}
            - --tls-self-signed
            {{- end }}
            {{- if .Values.policy }}
            - --policy-file=/etc/karhutlasql/policy.yaml
            {{- end }}
            {{- if .Values.classification }}
            - --classification-file=/etc/karhutlasql/classification.yaml
            {{- end }}
            {{- if not .Values.fourEyes }}
            - --four-eyes=false
            {{- end }}
            {{- with .Values.archive.s3.endpoint }}
            - --archive-s3-endpoint={{ . }}
            - --archive-s3-bucket={{ required "archive.s3.bucket is required" $.Values.archive.s3.bucket }}
            - --archive-s3-region={{ $.Values.archive.s3.region }}
            - --archive-retention={{ $.Values.archive.retention }}
            {{- if $.Values.archive.s3.insecure }}
            - --archive-s3-insecure
            {{- end }}
            {{- end }}
            {{- if .Values.reports }}
            - --reports-file=/etc/karhutlasql/reports.yaml
            {{- end }}
            {{- if .Values.reportSigning.existingSecret }}
            - --report-signing-key-file=/keys/report.key
            {{- end }}
            - --dq-max-age={{ .Values.dq.maxAge }}
            {{- with .Values.reportSigning.vaultKey }}
            - --report-signing-vault-key={{ . }}
            {{- end }}
            {{- if .Values.archive.s3.endpoint }}
            - --backup-interval={{ .Values.backup.interval }}
            - --backup-retention-daily={{ .Values.backup.retention.daily }}
            - --backup-retention-weekly={{ .Values.backup.retention.weekly }}
            - --backup-retention-monthly={{ .Values.backup.retention.monthly }}
            {{- end }}
            {{- with .Values.unityCatalog.endpoint }}
            - --uc-endpoint={{ . }}
            - --uc-sync-interval={{ $.Values.unityCatalog.syncInterval }}
            {{- with $.Values.unityCatalog.advertisedEndpoint }}
            - --uc-advertised-endpoint={{ . }}
            {{- end }}
            {{- end }}
            {{- with $allowed }}
            - --allowed-directories={{ join "," . }}
            {{- end }}
            {{- with .Values.mcp.port }}
            - --mcp-port={{ . }}
            - --mcp-max-rows={{ $.Values.mcp.maxRows }}
            {{- with $.Values.mcp.resourceUrl }}
            - --mcp-resource-url={{ . }}
            {{- end }}
            {{- end }}
            {{- if .Values.verifiedQueries }}
            - --verified-queries-file=/etc/karhutlasql/verified-queries.yaml
            {{- end }}
            {{- if $lake.catalog }}
            - --init-sql-file=/etc/karhutlasql/init.sql
            - --duckdb-secrets-file=/etc/karhutlasql/secrets.yaml
            {{- end }}
            {{- with .Values.oidc.issuer }}
            - --oidc-issuer={{ . }}
            - --oidc-audience={{ $.Values.oidc.audience }}
            {{- end }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: KARHUTLASQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ $secret }}, key: password }
            - name: KARHUTLASQL_JWT_SECRET
              valueFrom:
                secretKeyRef: { name: {{ $secret }}, key: jwt-secret, optional: true }
            - name: KARHUTLASQL_MASK_KEY
              valueFrom:
                secretKeyRef: { name: {{ $secret }}, key: mask-key, optional: true }
            {{- if .Values.archive.s3.endpoint }}
            - name: KARHUTLASQL_ARCHIVE_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: {{ required "archive.existingSecret is required" .Values.archive.existingSecret }}, key: access-key }
            - name: KARHUTLASQL_ARCHIVE_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.archive.existingSecret }}, key: secret-key }
            {{- end }}
            {{- if $lake.catalog }}
            {{- $ls := required "ducklake.existingSecret is required" $lake.existingSecret }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: {{ $ls }}, key: pg-password }
            - name: KARHUTLASQL_LAKE_KEY_ID
              valueFrom:
                secretKeyRef: { name: {{ $ls }}, key: s3-key-id }
            - name: KARHUTLASQL_LAKE_SECRET
              valueFrom:
                secretKeyRef: { name: {{ $ls }}, key: s3-secret }
            {{- end }}
            {{- with .Values.unityCatalog.existingSecret }}
            - name: KARHUTLASQL_UC_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ . }}, key: uc-token }
            {{- end }}
          ports:
            - { name: flight, containerPort: 31337 }
            - { name: admin, containerPort: 9090 }
            {{- with .Values.mcp.port }}
            - { name: mcp, containerPort: {{ . }} }
            {{- end }}
          readinessProbe:
            httpGet: { path: /healthz, port: admin, scheme: HTTPS }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: admin, scheme: HTTPS }
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 6
          securityContext: {{- include "karhutlasql.containerSecurity" . | nindent 12 }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
            {{- if $config }}
            - { name: policy, mountPath: /etc/karhutlasql, readOnly: true }
            {{- end }}
            {{- if .Values.reportSigning.existingSecret }}
            - { name: keys, mountPath: /keys, readOnly: true }
            {{- end }}
            {{- if .Values.tls.existingSecret }}
            - { name: tls, mountPath: /tls, readOnly: true }
            {{- end }}
      terminationGracePeriodSeconds: 40 # drain gRPC ≤ 30s
      volumes:
        {{- if $config }}
        - name: policy
          configMap: { name: {{ include "karhutlasql.fullname" . }}-policy }
        {{- end }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "karhutlasql.fullname" . }}
        {{- if .Values.tls.existingSecret }}
        - name: tls-secret
          secret: { secretName: {{ .Values.tls.existingSecret }}, defaultMode: 0440 }
        - name: tls
          emptyDir: { medium: Memory, sizeLimit: 1Mi }
        {{- end }}
        {{- if .Values.reportSigning.existingSecret }}
        - name: report-secret
          secret: { secretName: {{ .Values.reportSigning.existingSecret }}, defaultMode: 0440 }
        - name: keys
          emptyDir: { medium: Memory, sizeLimit: 1Mi }
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
