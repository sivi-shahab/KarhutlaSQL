apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "karhutlasql.fullname" . }}
  labels: {{- include "karhutlasql.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
