image:
  repository: karhutlasql
  tag: dev
  pullPolicy: IfNotPresent

auth:
  username: admin
  # Wajib: Secret berisi key `password` (plaintext atau hash bcrypt), opsional
  # `jwt-secret` (HS256, ≥ 32 byte; tanpa ini token hangus saat restart) dan
  # `mask-key` (HMAC mask hash_hmac).
  existingSecret: ""

tls:
  # Secret tipe kubernetes.io/tls (tls.crt, tls.key). Kosong = sertifikat
  # self-signed di memori (dev; klien --tls-skip-verify).
  existingSecret: ""
  # Menyalin kunci ke emptyDir dengan mode 0600 (server menolak kunci yang
  # bisa dibaca group; fsGroup membuat mount Secret 0440).
  initImage: busybox:1.37

# Isi policy.yaml (spec §5.3 + allow). Kosong = hanya user lokal sebagai
# admin (dev). Perubahan me-restart pod (annotation checksum).
policy: ""

# Isi classification.yaml (tag kolom + mask, G-03). Mask hash_hmac butuh key
# `mask-key` (>= 32 byte) di auth.existingSecret.
classification: ""

# Four-eyes (G-11): perubahan policy/classification (ConfigMap baru → restart)
# menjadi pending sampai disetujui 2 admin berbeda; state di PVC.
fourEyes: true

# Arsip access-history & report (G-05/G-10): bucket S3/MinIO dengan
# object-lock. Secret existingSecret berisi key `access-key` & `secret-key`.
archive:
  s3:
    endpoint: ""        # host:port; kosong = arsip mati (dev)
    bucket: ""
    region: us-east-1
    insecure: false
  existingSecret: ""
  retention: 87600h     # 10 tahun, COMPLIANCE

# Isi reports.yaml (G-10). Kunci tanda tangan: Secret reportSigning.existingSecret
# key `report.key` (Ed25519 PKCS#8 PEM).
reports: ""
reportSigning:
  existingSecret: ""
  # Alternatif kunci di Vault Transit/HSM (Fase 8d): <mount>/<nama>; env
  # VAULT_ADDR dll. dan token (Vault Agent) lewat extraEnv/extraArgs.
  vaultKey: ""

# Backup bertingkat ke arsip (Fase 8d); "0" = hanya DoAction backup.
backup:
  interval: "0"
  retention: { daily: 168h, weekly: 840h, monthly: 9600h }

# DQ gate report run (Q-05): validasi GX tiap tabel sumber harus lebih muda
# dari ini dan pada data yang sama; "0" = gate mati.
dq:
  maxAge: 26h

# Sinkron metadata satu arah ke Unity Catalog OSS (K-01..K-04). UC tidak
# boleh punya kredensial bucket KarhutlaSQL (ADR 13). Token opsional: key
# `uc-token` di existingSecret.
unityCatalog:
  endpoint: ""            # mis. http://unity-catalog:8080; kosong = mati
  syncInterval: 15m
  advertisedEndpoint: ""  # karhutla.endpoint; kosong = grpc+tls://<host>:31337
  existingSecret: ""

# Residency (G-07): path/prefix URL yang boleh diakses DuckDB.
allowedDirectories: []

# Server MCP untuk agen AI (Fase 8c): Streamable HTTP /mcp di port ini
# (TLS sama dengan gRPC), Bearer = token OIDC/lokal pemanggil; batas profil
# ai_sandbox berlaku untuk setiap tool call. 0 = mati.
mcp:
  port: 0
  resourceUrl: ""      # URL publik, mis. https://kq.bank.local:8443/mcp (metadata OAuth RFC 9728)
  maxRows: 500
# Isi verified-queries.yaml (verified queries + semantic model).
verifiedQueries: ""

# DuckLake multi-writer (Fase 8a, ADR 35): catalog metadata di Postgres, file
# data di S3/MinIO. Butuh image varian lake (make docker-lake). Instance per
# kelas beban = satu release per kelas dengan nilai lake yang sama (lihat
# examples/lake-*.yaml). Secret existingSecret: key `pg-password`,
# `s3-key-id`, `s3-secret`.
ducklake:
  catalog: ""           # nama catalog di SQL, mis. lake; kosong = mati
  metadata: ""          # libpq conninfo TANPA password, mis. "host=pg dbname=lake user=karhutla"
  dataPath: ""          # mis. s3://lake/data/ (otomatis masuk allowedDirectories)
  s3:
    endpoint: ""        # host:port MinIO; kosong = AWS S3
    region: us-east-1
    urlStyle: path
    useSSL: true
  existingSecret: ""

oidc:
  issuer: ""            # mis. https://sso.corp/realms/data; wajib policy
  audience: karhutlasql

queryTimeout: 300
# Resource group default (G-08); grup lain di policy.resource_groups.
scheduler:
  maxConcurrent: 8
  queueSize: 64
  queueTimeout: 60s
# Request RPC/detik per user (token bucket); 0 = mati.
rateLimit: { perUser: 0, burst: 20 }
slowQueryThreshold: 10s
queryProfiling: false   # peak memory & plan hash di query history; +~13% waktu eksekusi
extraArgs: []

persistence:
  size: 10Gi
  storageClass: ""

service:
  type: ClusterIP
  port: 31337

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
