image:
  repository: karhutlasql
  tag: dev
  pullPolicy: IfNotPresent

auth:
  username: admin
  # Wajib: Secret berisi key `password` (plaintext atau hash bcrypt), opsional
  # `jwt-secret` (HS256, ≥ 32 byte; tanpa ini token hangus saat restart) dan
  # `mask-key` (HMAC mask hash_hmac).
  existingSecret: ""

tls:
  # Secret tipe kubernetes.io/tls (tls.crt, tls.key). Kosong = sertifikat
  # self-signed di memori (dev; klien --tls-skip-verify).
  existingSecret: ""
  # Menyalin kunci ke emptyDir dengan mode 0600 (server menolak kunci yang
  # bisa dibaca group; fsGroup membuat mount Secret 0440).
  initImage: busybox:1.37

# Isi policy.yaml (spec §5.3 + allow). Kosong = hanya user lokal sebagai
# admin (dev). Perubahan me-restart pod (annotation checksum).
policy: ""

# Isi classification.yaml (tag kolom + mask, G-03). Mask hash_hmac butuh key
# `mask-key` (>= 32 byte) di auth.existingSecret.
classification: ""

oidc:
  issuer: ""            # mis. https://sso.corp/realms/data; wajib policy
  audience: karhutlasql

queryTimeout: 300
extraArgs: []

persistence:
  size: 10Gi
  storageClass: ""

service:
  type: ClusterIP
  port: 31337

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
