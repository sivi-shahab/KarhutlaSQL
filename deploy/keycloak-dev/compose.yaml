# Keycloak dev (realm "karhutlasql"). Bukan untuk produksi.
#   export KEYCLOAK_ADMIN_PASSWORD=...   # tidak ada default
#   docker compose -f deploy/keycloak-dev/compose.yaml up -d
# Issuer: http://localhost:${KEYCLOAK_PORT:-8080}/realms/karhutlasql
# User realm (ana, dian, eve) tanpa password: set lewat admin console/API.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
    ports: ["${KEYCLOAK_PORT:-8080}:8080"]
    volumes: ["./realm-karhutlasql.json:/opt/keycloak/data/import/realm-karhutlasql.json:ro"]
