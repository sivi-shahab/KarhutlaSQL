# Policy dev untuk realm Keycloak ini (spec §5.3 + allow E-02 + governance G-02..G-06, G-08).
default: deny
allow:
  domains: [bankmega.com]
roles:
  admin:   { catalogs: { "*": [read, write, admin] }, unmask: ["*"] }
  analyst: { catalogs: { warehouse: [read], sandbox: [read, write] } }
  cabang:
    catalogs: { warehouse.main.nasabah: [read] }
    row_filters: { warehouse.main.nasabah: "branch_code = {{claim.branch}}" }
  ai_sandbox:
    catalogs: { warehouse: [read], sandbox: [read, write] }
    select_only: true
    max_rows: 500
    max_bytes: 104857600
    timeout: 60s
    resource_group: ai
# Kelas beban (G-08); role tanpa resource_group → grup default (flag --max-concurrent dst.).
resource_groups:
  batch: { max_concurrent: 2, queue_size: 32, queue_timeout: 10m, timeout: 2h }
  ai:    { max_concurrent: 2, queue_size: 8, queue_timeout: 30s, timeout: 60s }
subjects:
  - { match: { claim: groups, equals: data-platform }, roles: [admin] }
  - { match: { claim: groups, equals: analyst }, roles: [analyst] }
  - { match: { claim: groups, equals: cabang }, roles: [cabang] }
  - { match: { claim: groups, equals: ai-agent }, roles: [ai_sandbox] }
  - { match: { user: admin }, roles: [admin] }
