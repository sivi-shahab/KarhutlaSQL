# Dev: server + Prometheus + Grafana (dashboard KarhutlaSQL ter-provision).
#   export KARHUTLASQL_PASSWORD=...
#   docker compose -f deploy/observability/compose.yaml up -d
#   Grafana http://localhost:3000 (admin/admin, ganti saat login pertama)
services:
  server:
    image: karhutlasql:dev
    environment:
      KARHUTLASQL_PASSWORD: ${KARHUTLASQL_PASSWORD:?set KARHUTLASQL_PASSWORD}
    ports: ["31337:31337", "9090:9090"]
    volumes: ["data:/data"]

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9091:9090"]

  grafana:
    image: grafana/grafana:12.1.0
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]

volumes:
  data: {}
